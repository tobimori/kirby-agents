#:schema vendor/carthage-software/mago/schema.json
version = "1"
php-version = "8.2"

[source]
paths = ["index.php", "classes", "config"]
includes = ["vendor"]

[source.glob]
literal-separator = true

[formatter]
use-tabs = true
tab-width = 4

[linter]
minimum-fail-level = "warning"

[linter.rules]
literal-named-argument = { enabled = false }
readable-literal = { enabled = false }
cyclomatic-complexity = { enabled = false }
excessive-parameter-list = { enabled = false }
kan-defect = { enabled = false }
too-many-methods = { enabled = false }
halstead = { enabled = false }
# Kirby binds `$this` to route, hook, and area closures
prefer-static-closure = { exclude = ["config/"] }
prefer-first-class-callable = { exclude = ["config/"] }

[analyzer]
ignore = ["mixed-assignment"]
